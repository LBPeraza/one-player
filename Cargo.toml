[package]
name = "one-player"
authors = ["Lukas Peraza <LBPeraza@users.noreply.github.com>"]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.19.0", features = ["audio", "ui", "2d"] }
bevy_common_assets = { version = "0.17.0", features = ["toml"] }
bevy_pancam = "0.21"
bevy_vector_shapes = "0.13"
serde = { version = "1.0.229", features = ["derive"] }
